name: CareerPilot Daily Job Digest

on:
  schedule:
    # 08:00 IST = 02:30 UTC. Runs Monday-Saturday.
    - cron: "30 2 * * 1-6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create private profile
        shell: bash
        env:
          CAREERPILOT_PROFILE_JSON: ${{ secrets.CAREERPILOT_PROFILE_JSON }}
        run: |
          mkdir -p data
          printf '%s' "$CAREERPILOT_PROFILE_JSON" > data/profile.json
          python -m json.tool data/profile.json > /dev/null

      - name: Run daily digest and email it
        env:
          PYTHONPATH: ${{ github.workspace }}
          CAREERPILOT_SMTP_HOST: ${{ secrets.CAREERPILOT_SMTP_HOST }}
          CAREERPILOT_SMTP_PORT: ${{ secrets.CAREERPILOT_SMTP_PORT }}
          CAREERPILOT_SENDER_EMAIL: ${{ secrets.CAREERPILOT_SENDER_EMAIL }}
          CAREERPILOT_EMAIL_APP_PASSWORD: ${{ secrets.CAREERPILOT_EMAIL_APP_PASSWORD }}
          CAREERPILOT_RECIPIENT_EMAIL: ${{ secrets.CAREERPILOT_RECIPIENT_EMAIL }}
        run: python scripts/run_daily_digest.py --send-email

      - name: Upload digest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: careerpilot-digest-${{ github.run_id }}
          path: |
            exports/reports/*
          if-no-files-found: ignore
          retention-days: 14